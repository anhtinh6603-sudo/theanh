# Registry Agent - nguồn sự thật duy nhất về Agent con.
# status: proposed (chờ chủ duyệt) | active | locked (vượt phạm vi, đã khóa) | retired
version: 2
updated: 2026-10-22
max_retry: 2

agents:
  - id: edit-video
    agent_type: edit-video
    file: .claude/agents/edit-video.md
    capability: Dựng/cắt/ghép/chèn chữ/đổi định dạng video bằng ffmpeg, kiểm tra bằng ffprobe
    inputs: footage + brief trong thư mục nhận việc
    outputs: MP4 trong outputs/<job_id>/
    permission_tier: tu_dong_hoan_toan
    status: active

  - id: content-bot
    agent_type: content-bot
    file: .claude/agents/content-bot.md
    capability: Vận hành pipeline 6 bot trong content-bot-system/ (scrape, ý tưởng, viết, ảnh, video)
    inputs: content-bot-system/config + .env của chủ
    outputs: content-bot-system/data/ và output/
    permission_tier: tu_dong_co_giam_sat   # bước 6 (auto-poster) luôn phải xin duyệt
    status: active

  - id: cham-soc-khach
    agent_type: cham-soc-khach
    file: .claude/agents/cham-soc-khach.md
    capability: Soạn trả lời khách 08:00-22:00, chống gửi trùng/spam; gửi thật phải xin duyệt
    permission_tier: xin_duyet
    status: active     # chủ duyệt 2026-10-22; chỉ soạn nháp cho tới khi chủ kết nối kênh nhắn tin
    blocked_by: chủ kết nối kênh (Facebook/Zalo) + điền memory/brand.md
