name: Build Android APK

on:
  push:
    branches:
      - claude/video-image-generation-mobile-app-fzxokv
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anh-thanh-video-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk anh-thanh-video-${{ github.run_number }}.apk

      - name: Publish release with APK asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: APK build #${{ github.run_number }}
          files: anh-thanh-video-${{ github.run_number }}.apk
